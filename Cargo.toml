[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
eightr-dex = { path = "crates/eightr-dex" }
eightr-ir = { path = "crates/eightr-ir" }
eightr-mapping = { path = "crates/eightr-mapping" }
eightr-rules = { path = "crates/eightr-rules" }
eightr-core = { path = "crates/eightr-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.clippy]
disallowed_types = "deny"

[profile.test]
opt-level = 1
