# Embedded fallback signature DBs for `cargo xtask sigdb` (docs/research/libdb.md): one line per
# library version, `library version group:artifact:version`. Each is forged by `8r-forge` for the
# profile "that library alone" (R8 9.4.24, min-api 24, the default scenario catalog); the DB keeps
# the library's own classes. Output: sigdb/<library>.sigdb, one file per library holding every
# version. Apps with a pack forged for their own profile (`8r undo --libdb`) use it instead.
