# kotlinc lowerings (docs/sources/kotlinc.md): data classes, lateinit, delegated properties,
# value classes, $default/@JvmOverloads, when-mappings, sealed classes, companions, inline
# functions, lambdas and function references, suspend state machines, @JvmName facades.
min_api = 24
keep = -keep class com.example.MainKt { public static void main(java.lang.String[]); }
keep = -keepattributes SourceFile,LineNumberTable,*Annotation*,InnerClasses,Signature,EnclosingMethod
keep = -dontwarn **
