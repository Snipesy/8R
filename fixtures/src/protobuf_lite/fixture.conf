# protobuf-lite message classes (r8/protobuf-message-name), in the shape protoc's lite codegen
# emits, with their .proto bundled as a package resource. The consumer rule keeps every field of
# a GeneratedMessageLite subclass (so the *_FIELD_NUMBER constants survive, names and values).
min_api = 24
r8 = r8-9.4.24
resource = proto/app.proto
keep = -keep class com.example.pb.Main { public static void main(java.lang.String[]); }
keep = -keepclassmembers class * extends com.google.protobuf.GeneratedMessageLite { <fields>; }
main = com.example.pb.Main
