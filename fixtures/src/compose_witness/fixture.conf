# Compose review witnesses (M1): changedInstance under strong skipping; defaults without composer calls.
r8 = r8-9.4.24
min_api = 24
lib = compose-runtime
lib = compose-runtime-annotation
lib = collection
lib = coroutines
plugin = compose
plugin_option = androidx.compose.compiler.plugins.kotlin:sourceInformation=true
keep = -keep class com.example.witness.Main { public static void main(java.lang.String[]); }
keep = -dontwarn **
keep = -ignorewarnings
main = com.example.witness.Main
