# Compose compiler plugin shapes (docs/sources/compose.md §6: F1, F2, F4, F7, F9, F11, F12, F14,
# F19, F21) under R8 9.4.24. `main` drives a real Composition with a no-op applier and prints
# what the composables compute, so behavior can be compared on ART.
r8 = r8-9.4.24
min_api = 24
lib = compose-runtime
lib = compose-runtime-annotation
lib = collection
lib = coroutines
plugin = compose
plugin_option = androidx.compose.compiler.plugins.kotlin:sourceInformation=true
keep = -keep class com.example.shapes.Main { public static void main(java.lang.String[]); }
keep = -dontwarn **
keep = -ignorewarnings
main = com.example.shapes.Main
