# Fields looked up by name from string tables (serializer/protobuf style), names kept by keep
# rules. Exercises kept-name's per-class field bound and the class-local string pins.
r8 = r8-9.4.24
min_api = 26
main = com.example.reflect.Main
keep = -keep class com.example.reflect.Main { public static void main(java.lang.String[]); }
keep = -keepclassmembers class com.example.reflect.Msg { <fields>; }
keep = -keepclassmembers class com.example.reflect.Pair { <fields>; }
