# Jetpack Compose compiler plugin (docs/sources/compose.md): restartable/non-restartable/
# inline/read-only composables, defaults, $changed/$default masks, keys, remember, lambdas.
# Entry drives a real Composition with a no-op applier so nothing is dead code.
min_api = 24
lib = compose-runtime
lib = compose-runtime-annotation
lib = collection
lib = coroutines
plugin = compose
keep = -keep class com.example.app.Entry { public static void start(); }
keep = -dontwarn **
keep = -ignorewarnings
