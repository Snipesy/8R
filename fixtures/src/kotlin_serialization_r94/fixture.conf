# Twin of kotlin_serialization built with R8 9.4.24 (the generation Gretio uses).
sources = kotlin_serialization
r8 = r8-9.4.24
min_api = 24
lib = kxs-core
plugin = kotlinx-serialization
keep = -keep class com.example.MainKt { public static void main(java.lang.String[]); }
keep = -keepattributes SourceFile,LineNumberTable
keep = -dontwarn **
main = com.example.MainKt
