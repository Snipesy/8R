# compose_witness2 by Kotlin 2.1.21 without strong skipping (its default before 2.0.20): no
# $dirty computation for unstable params, so a flags param is only bit-tested.
sources = compose_witness2
kotlinc = kotlinc-2.1.21
plugin_option = androidx.compose.compiler.plugins.kotlin:featureFlag=-StrongSkipping
r8 = r8-9.4.24
min_api = 24
lib = compose-runtime
lib = compose-runtime-annotation
lib = collection
lib = coroutines
plugin = compose
plugin_option = androidx.compose.compiler.plugins.kotlin:sourceInformation=true
keep = -keep class com.example.rw.Main { public static void main(java.lang.String[]); }
keep = -dontwarn **
keep = -ignorewarnings
main = com.example.rw.Main
