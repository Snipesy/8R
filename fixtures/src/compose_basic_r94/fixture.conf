# Twin of compose_basic built with R8 9.4.24 (the generation Gretio uses).
sources = compose_basic
r8 = r8-9.4.24
min_api = 24
lib = compose-runtime
lib = compose-runtime-annotation
lib = collection
lib = coroutines
plugin = compose
keep = -keep class com.example.app.Entry { public static void start(); }
keep = -dontwarn **
keep = -ignorewarnings
