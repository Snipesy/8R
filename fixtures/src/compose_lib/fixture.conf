# Library composables by key (compose/lib-key; docs/research/compose-keys.md): an app using material3 1.4.0
# and Compose 1.10.6 composables, shrunk with the libraries' consumer rules. Its mapping grades the
# key matcher. No main (the UI classes need an Android Context).
min_api = 24
r8 = r8-9.4.24
plugin = compose
lib = collection
lib = coroutines
lib = cl-runtime-android
lib = cl-runtime-saveable-android
lib = cl-runtime-annotation-android
lib = cl-ui-android
lib = cl-ui-graphics-android
lib = cl-ui-unit-android
lib = cl-ui-geometry-android
lib = cl-ui-text-android
lib = cl-ui-util-android
lib = cl-foundation-android
lib = cl-foundation-layout-android
lib = cl-animation-android
lib = cl-animation-core-android
lib = cl-material-ripple-android
lib = cl-material-icons-core-android
lib = cl-material3-android
lib = cl-annotation-jvm
lib = cl-core
lib = cl-lifecycle-common-jvm
lib = cl-lifecycle-runtime-android
lib = cl-lifecycle-runtime-compose-android
lib = cl-lifecycle-viewmodel-android
lib = cl-savedstate-android
lib = cl-autofill
lib = cl-kotlinx-coroutines-android
keep = -keep class com.example.app.Entry { public static void start(); }
keep = -dontwarn **
keep = -ignorewarnings
