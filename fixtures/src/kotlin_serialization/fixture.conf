# kotlinx.serialization plugin (docs/sources/kotlinx-serialization.md). A custom list
# encoder/decoder keeps the generated serializers live and non-constant under R8.
min_api = 24
lib = kxs-core
plugin = kotlinx-serialization
keep = -keep class com.example.MainKt { public static void main(java.lang.String[]); }
keep = -keepattributes SourceFile,LineNumberTable
keep = -dontwarn **
