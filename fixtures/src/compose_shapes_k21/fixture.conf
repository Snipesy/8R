# Twin of compose_shapes compiled by Kotlin 2.1.21's Compose plugin (docs/research/compiler-eras.md):
# the older skip check `getSkipping()`, `P(i)` sourceInformation and anonymous restart lambdas.
sources = compose_shapes
kotlinc = kotlinc-2.1.21
r8 = r8-9.4.24
min_api = 24
lib = compose-runtime
lib = compose-runtime-annotation
lib = collection
lib = coroutines
plugin = compose
plugin_option = androidx.compose.compiler.plugins.kotlin:sourceInformation=true
keep = -keep class com.example.shapes.Main { public static void main(java.lang.String[]); }
keep = -dontwarn **
keep = -ignorewarnings
main = com.example.shapes.Main
