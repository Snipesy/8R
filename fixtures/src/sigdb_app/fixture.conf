# Library signature DB (docs/research/sigdb.md): an app using a broad slice of coroutines, okhttp,
# okio, collection and the stdlib, shrunk with their consumer rules. Its mapping grades the sigdb
# matcher (library methods named by fingerprint against sigdb/*.sigdb, same versions).
min_api = 24
lib = coroutines-1.10.2
lib = okhttp-4.12.0
lib = okio-3.6.0
lib = collection
keep = -keep class app.MainKt { public static void main(java.lang.String[]); }
keep = -dontwarn **
keep = -ignorewarnings
r8 = r8-9.4.24
main = app.MainKt
