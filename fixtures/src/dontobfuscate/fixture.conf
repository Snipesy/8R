# -dontobfuscate: nothing is minified, but R8 still invents names (synthetics like
# $r8$classId / EnumUnboxing utilities / lambdas, and fresh names like calc$1). None of those
# are original, so kept-name must not claim them. (docs/sources/r8-rule-audit.md, E18)
min_api = 21
keep = -dontobfuscate
keep = -keep class com.example.Main { public static void main(java.lang.String[]); }
keep = -keep class com.example.Calc { public static void run(java.lang.String[]); }
