# compose_witness2 by Kotlin 2.1.10 with PausableComposition: shouldExecute skip checks, but
# ComposableSingletons fields still named lambda-N.
sources = compose_witness2
kotlinc = kotlinc-2.1.10
plugin_option = androidx.compose.compiler.plugins.kotlin:featureFlag=PausableComposition
r8 = r8-9.4.24
min_api = 24
lib = compose-runtime
lib = compose-runtime-annotation
lib = collection
lib = coroutines
plugin = compose
plugin_option = androidx.compose.compiler.plugins.kotlin:sourceInformation=true
keep = -keep class com.example.rw.Main { public static void main(java.lang.String[]); }
keep = -dontwarn **
keep = -ignorewarnings
main = com.example.rw.Main
