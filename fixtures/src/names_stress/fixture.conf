# Stresses R8's name generator past the cases small fixtures never reach. From the
# no-mapping R8 study (docs/sources/r8-desugar.md §0):
#   C1  >52 classes in a package (R8 <= 8.12 is mixed-case) / >52 fields in a class => digit names (a0, p0, ...)
#   C2  inner classes of a kept outer, InnerClasses kept   => Outer$a
#   C3/C4 -keep,allowrepackage + -repackageclasses ''      => package moved, collision suffix (Rep1)
min_api = 21
keep = -keepattributes InnerClasses,Signature,EnclosingMethod
keep = -repackageclasses ''
keep = -keep,allowobfuscation class com.example.gen.** { *; }
keep = -keep,allowobfuscation class com.example.Wide { *; }
keep = -keep class com.example.Outer { *; }
keep = -keep,allowobfuscation class com.example.Outer$* { *; }
keep = -keep,allowrepackage class com.example.sub1.Rep { *; }
keep = -keep,allowrepackage class com.example.sub2.Rep { *; }
