# Real-app shapes that broke naming at run time (Pokédex Compose, R8 partially kept):
# * a superclass method that implements an interface method only through a subclass
#   (`Flow extends Base implements Source`, `Base.offer()` implements `Source.offer()`): one
#   dispatch slot, so one name;
# * class names held in strings (`-adaptclassstrings`, as Hilt's `@LazyClassKey` maps) and
#   compared with `Class.getName()`: those classes keep their names.
r8 = r8-9.4.24
min_api = 26
main = com.example.slots.Main
keep = -keep class com.example.slots.Main { public static void main(java.lang.String[]); }
keep = -adaptclassstrings com.example.slots.**
keep = -repackageclasses o
