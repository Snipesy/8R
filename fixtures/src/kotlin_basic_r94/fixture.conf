# Twin of kotlin_basic built with R8 9.4.24 (the generation Gretio uses).
sources = kotlin_basic
r8 = r8-9.4.24
min_api = 24
keep = -keep class com.example.MainKt { public static void main(java.lang.String[]); }
keep = -keepattributes SourceFile,LineNumberTable,*Annotation*,InnerClasses,Signature,EnclosingMethod
keep = -dontwarn **
