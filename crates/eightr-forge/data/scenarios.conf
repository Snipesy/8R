# LibDB scenario catalog (docs/research/libdb.md §6): the default set `8r-forge build` forges.
# One scenario per line: KIND NAME [key=value ...]
#   lib-alone   keep the whole public API (-keep public class * { public protected *; })
#   roots       -keep,allowobfuscation,allowoptimization on a hash-sample of public methods
#   callers     generated Java callers of a hash-sample, arguments from an opaque (native) source
#   defaults    calls of a hash-sample of Kotlin default-argument bridges taking every default
#               (constant 0/null + mask, as kotlinc emits them), other arguments opaque
# frac = sampled fraction, seed = sample seed, part = I/K: hash bucket I of K instead (disjoint
# scenarios: a function called directly in one isn't an extra caller in the others), scope = declared (the app's declared libraries and
# the artifacts they redirect to; default) | closure (every resolved artifact).
lib-alone all
roots   r1 frac=0.05 seed=1
roots   r2 frac=0.05 seed=2
roots   r3 frac=0.05 seed=3
roots   r4 frac=0.05 seed=4
roots   r5 frac=0.05 seed=5
roots   r6 frac=0.05 seed=6
callers c1 frac=0.05 seed=1
callers c2 frac=0.05 seed=2
callers c3 frac=0.05 seed=3
callers c4 frac=0.05 seed=4
callers c5 frac=0.05 seed=5
callers c6 frac=0.05 seed=6
defaults d1 part=0/4
defaults d2 part=1/4
defaults d3 part=2/4
defaults d4 part=3/4
